[tool.flake8]
show-source = true
filename = ["*.py"]
exclude = [
    ".git",
    "__pycache__",
    "*.pyc",
    "webapp.wsgi",
    "__init__.py"
]
statistics = true
max-line-length = 119
ignore = [
    "W503",
    "E203",
    "E231",
    "E402",
]

# Ignore unused imports in __init__.py files
per-file-ignores = {"__init__.py" = ["F401"]}


[tool.isort]
atomic = true
profile = "black"
line_length = 119
skip_gitignore = true
known_first_party = ["black", "blib2to3", "blackd", "_black_version"]

[tool.pytest.ini_options]
minversion = "6.0"
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.pylint]
disable = [
    "redefined-outer-name",
    "too-few-public-methods",
    "cell-var-from-loop",
    "unspecified-encoding",
    "expression-not-assigned",
    "logging-format-interpolation",
    "broad-exception-caught",
    "no-member",
    "global-statement",
    "global-variable-not-assigned",
    "no-name-in-module"
]
load-plugins = ["pylint_pydantic"]
extension-pkg-allow-list = ["pydantic"]

[project]
name = "cliston"
version = "0.1.0"
description = "Cliston (Hank's Dredel Led robot butler)"
authors = [
    {name = "Alexey Klechikov", email = "mail@klechikov.info"},
]
dependencies = [
    "pydantic>=2.12.5",
    "python-dotenv>=1.1.1",
    "httpx>=0.28.1",
    "fastapi>=0.135.1",
    "python-telegram-bot>=21.7",
    "uvicorn>=0.30.0",
    "dotenv>=0.9.9",
    "langchain-community>=0.4.1",
    "sentence-transformers>=5.2.3",
    "tavily-python>=0.7.23",
    "google-genai>=1.68.0",
    "pypdf>=6.9.2",
    "python-docx>=1.2.0",
    "chromadb>=1.1.1",
    "langchain-text-splitters>=1.1.1",
    "stagehand-py>=0.3.10",
]
requires-python = "==3.12.*"
readme = "README.md"
license = {text = "MIT"}

[dependency-groups]
dev = [
    "black",
    "pytest",
    "pre-commit",
    "pylint-pydantic",
    "flake8-pyproject",
    "pyupgrade",
    "pytest-env>=1.2.0",
]

[tool.black]
line-length = 119
target-version = ['py312']

[tool.hatch.build.targets.wheel]
packages = ["cliston", "embedder_service"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
